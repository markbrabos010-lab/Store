<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجري</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Tahoma, Arial, sans-serif; background: #f5f6fa; color: #333; }

    header {
      background: #2d3436; color: #fff; padding: 15px 30px;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 10;
    }
    header h1 { font-size: 24px; }
    .cart-btn {
      background: #00b894; border: none; color: #fff; padding: 10px 18px;
      border-radius: 8px; cursor: pointer; font-size: 16px;
    }

    .hero {
      background: linear-gradient(135deg, #6c5ce7, #00b894);
      color: #fff; text-align: center; padding: 60px 20px;
    }
    .hero h2 { font-size: 36px; margin-bottom: 10px; }

    .products {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 20px; padding: 30px; max-width: 1200px; margin: auto;
    }
    .card {
      background: #fff; border-radius: 12px; overflow: hidden;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08); transition: .3s;
    }
    .card:hover { transform: translateY(-5px); }
    .card img { width: 100%; height: 200px; object-fit: cover; }
    .card-body { padding: 15px; }
    .card-body h3 { margin-bottom: 8px; }
    .price { color: #00b894; font-weight: bold; font-size: 18px; margin-bottom: 10px; }
    .add-btn {
      width: 100%; background: #6c5ce7; color: #fff; border: none;
      padding: 10px; border-radius: 8px; cursor: pointer; font-size: 15px;
    }
    .add-btn:hover { background: #5a4bd1; }

    .cart {
      position: fixed; top: 0; left: -400px; width: 360px; max-width: 100%;
      height: 100%; background: #fff; box-shadow: 2px 0 15px rgba(0,0,0,0.2);
      padding: 20px; transition: .3s; z-index: 20; overflow-y: auto;
    }
    .cart.open { left: 0; }
    .cart-item {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #eee; padding: 10px 0;
    }
    .qty button {
      width: 26px; height: 26px; border: none; background: #dfe6e9;
      border-radius: 5px; cursor: pointer;
    }
    .total { font-size: 20px; font-weight: bold; margin: 20px 0; }
    .checkout {
      width: 100%; background: #25d366; color: #fff; border: none;
      padding: 12px; border-radius: 8px; font-size: 16px; cursor: pointer;
    }
    .close { float: left; cursor: pointer; font-size: 22px; }

    footer { background: #2d3436; color: #fff; text-align: center; padding: 20px; margin-top: 30px; }
  </style>
</head>
<body>

  <header>
    <h1>🛍️ متجري</h1>
    <button class="cart-btn" onclick="toggleCart()">🛒 السلة (<span id="count">0</span>)</button>
  </header>

  <section class="hero">
    <h2>مرحباً بك في متجرنا</h2>
    <p>أفضل المنتجات بأفضل الأسعار</p>
  </section>

  <main class="products" id="products"></main>

  <aside class="cart" id="cart">
    <span class="close" onclick="toggleCart()">✖</span>
    <h2>سلة المشتريات</h2>
    <div id="cart-items"></div>
    <div class="total">المجموع: <span id="total">0</span> $</div>
    <button class="checkout" onclick="checkout()">إتمام الطلب عبر واتساب</button>
  </aside>

  <footer>© 2026 متجري - جميع الحقوق محفوظة</footer>

  <script>
    // ✏️ عدّل المنتجات من هنا
    const products = [
      { id: 1, name: "ساعة ذكية", price: 49, img: "https://picsum.photos/seed/watch/400/300" },
      { id: 2, name: "سماعات لاسلكية", price: 29, img: "https://picsum.photos/seed/headphones/400/300" },
      { id: 3, name: "حقيبة ظهر", price: 35, img: "https://picsum.photos/seed/bag/400/300" },
      { id: 4, name: "نظارة شمسية", price: 19, img: "https://picsum.photos/seed/glasses/400/300" },
      { id: 5, name: "حذاء رياضي", price: 59, img: "https://picsum.photos/seed/shoes/400/300" },
      { id: 6, name: "كوب حراري", price: 12, img: "https://picsum.photos/seed/cup/400/300" }
    ];

    // ✏️ ضع رقم واتساب الخاص بك (بدون + أو أصفار في البداية)
    const WHATSAPP = "966500000000";

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    function renderProducts() {
      document.getElementById("products").innerHTML = products.map(p => `
        <div class="card">
          <img src="${p.img}" alt="${p.name}">
          <div class="card-body">
            <h3>${p.name}</h3>
            <div class="price">${p.price} $</div>
            <button class="add-btn" onclick="addToCart(${p.id})">أضف إلى السلة</button>
          </div>
        </div>`).join("");
    }

    function addToCart(id) {
      const item = cart.find(i => i.id === id);
      if (item) item.qty++;
      else cart.push({ ...products.find(p => p.id === id), qty: 1 });
      update();
    }

    function changeQty(id, d) {
      const item = cart.find(i => i.id === id);
      item.qty += d;
      if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
      update();
    }

    function update() {
      localStorage.setItem("cart", JSON.stringify(cart));
      document.getElementById("count").textContent = cart.reduce((s, i) => s + i.qty, 0);
      document.getElementById("total").textContent = cart.reduce((s, i) => s + i.qty * i.price, 0);
      document.getElementById("cart-items").innerHTML = cart.length
        ? cart.map(i => `
          <div class="cart-item">
            <div><b>${i.name}</b><br>${i.price} $</div>
            <div class="qty">
              <button onclick="changeQty(${i.id},1)">+</button>
              ${i.qty}
              <button onclick="changeQty(${i.id},-1)">-</button>
            </div>
          </div>`).join("")
        : "<p style='margin-top:20px'>السلة فارغة</p>";
    }

    function toggleCart() {
      document.getElementById("cart").classList.toggle("open");
    }

    function checkout() {
      if (!cart.length) return alert("السلة فارغة!");
      let msg = "مرحباً، أريد طلب:\n";
      cart.forEach(i => msg += `- ${i.name} × ${i.qty} = ${i.qty * i.price}$\n`);
      msg += `المجموع: ${cart.reduce((s, i) => s + i.qty * i.price, 0)}$`;
      window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`);
    }

    renderProducts();
    update();
  </script>
</body>
</html>
