<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مدار — رحلة بين الكواكب</title>
<style>
  :root { color-scheme: dark; --accent: #78c8ff; --shade: #173ba5; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100svh; color: #f6f7ff;
    background: #070913; font-family: system-ui, sans-serif;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .wrap { position: relative; max-width: 1120px; margin: auto; padding: 28px 24px; }
  header { display: flex; justify-content: space-between; align-items: center; }
  header strong { font-size: 1.5rem; }
  .muted { color: #aeb8d2; }
  main {
    display: grid; grid-template-columns: 1fr 1fr; align-items: center;
    gap: 36px; min-height: 72svh;
  }
  h1 { font-size: clamp(4rem, 10vw, 8rem); margin: 0; line-height: 1.15; }
  p { line-height: 1.9; }
  .eyebrow, .stat strong { color: var(--accent); }
  .stats, nav { display: flex; flex-wrap: wrap; gap: 10px; }
  .stat, button {
    border: 1px solid #ffffff28; background: #ffffff08;
    border-radius: 14px; padding: 11px 16px;
  }
  .stat strong { display: block; margin-top: 4px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:hover, button[aria-pressed="true"] { border-color: var(--accent); }
  button[aria-pressed="true"] { background: var(--accent); color: #070913; }
  button:focus-visible { outline: 3px solid white; outline-offset: 4px; }
  .stage {
    position: relative; isolation: isolate; display: grid; place-items: center;
    aspect-ratio: 1; width: min(100%, 430px); margin: auto;
  }
  .orbit {
    position: absolute; width: 96%; height: 40%;
    border: 1px solid #ffffff37; border-radius: 50%; transform: rotate(-25deg);
  }
  .orbit:nth-child(2) { width: 112%; height: 54%; opacity: .5; }
  .planet {
    width: 58%; aspect-ratio: 1; border-radius: 50%;
    background:
      radial-gradient(circle at 29% 24%, #fff9, transparent 27%),
      repeating-linear-gradient(158deg, transparent 0 13px, #090d3829 16px 22px),
      radial-gradient(circle at 32% 28%, var(--accent), var(--shade) 57%, #070913 83%);
    box-shadow: inset -18px -22px 42px #0009, 0 0 65px -8px var(--accent);
  }
  .arrive { animation: arrive .55s ease-out; }
  @keyframes arrive {
    from { opacity: .35; transform: scale(.91); }
    to { opacity: 1; transform: scale(1); }
  }
  @media (max-width: 680px) {
    main { grid-template-columns: 1fr; gap: 10px; padding: 28px 0; }
    .stage { grid-row: 1; width: min(76%, 290px); }
  }
  @media (prefers-reduced-motion: reduce) { .arrive { animation: none; } }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="wrap">
  <header><strong>◉ مدار</strong><span class="muted">أطلس النظام الشمسي</span></header>
  <main>
    <section aria-live="polite" aria-atomic="true">
      <p class="eyebrow" id="tag"></p>
      <h1 id="name"></h1>
      <p class="muted" id="description"></p>
      <div class="stats">
        <div class="stat">ترتيبه من الشمس<strong id="order"></strong></div>
        <div class="stat">نوع الكوكب<strong id="kind"></strong></div>
      </div>
    </section>
    <div class="stage" aria-hidden="true">
      <div class="orbit"></div><div class="orbit"></div><div class="planet"></div>
    </div>
  </main>
  <nav id="picker" aria-label="اختر كوكبًا"></nav>
</div>
<script>
const planets = [
  ['عطارد', 'الأقرب إلى الشمس', 'سطحه الصخري مليء بالفوهات، ويشبه سطح القمر.', '#d5c7b9', '#645349', 'صخري'],
  ['الزهرة', 'تحت غطاء من السحب', 'يحبس غلافه الجوي الكثيف الحرارة، ما يجعله أشد الكواكب حرارة.', '#ffcf81', '#a05632', 'صخري'],
  ['الأرض', 'الكوكب الأزرق', 'تغطي المحيطات معظم سطحه، وهو عالمنا الوحيد المعروف بوجود الحياة.', '#78c8ff', '#173ba5', 'صخري'],
  ['المريخ', 'الكوكب الأحمر', 'تعطي أكاسيد الحديد غباره لونه الأحمر المميز.', '#ff9873', '#8b2f28', 'صخري'],
  ['المشتري', 'عملاق النظام الشمسي', 'أكبر كواكب النظام الشمسي، وتظهر في غلافه الجوي عاصفة تُعرف بالبقعة الحمراء العظيمة.', '#ffc69c', '#8d5144', 'عملاق غازي'],
  ['زحل', 'سيد الحلقات', 'تتكون حلقاته المميزة من قطع جليدية وصخرية تتفاوت في الحجم.', '#fbe0a0', '#8a673c', 'عملاق غازي'],
  ['أورانوس', 'يدور على جانبه', 'يميل محور دورانه بشدة، فيبدو كأنه يتدحرج حول الشمس.', '#a6f5ea', '#267b89', 'عملاق جليدي'],
  ['نبتون', 'في أقاصي النظام الشمسي', 'أبعد الكواكب عن الشمس، وتهب في غلافه الجوي رياح شديدة السرعة.', '#8b9fff', '#292997', 'عملاق جليدي']
];
const el = id => document.getElementById(id);
const globe = document.querySelector('.planet');
const buttons = planets.map(([name], i) => {
  const button = document.createElement('button');
  button.textContent = name;
  button.addEventListener('click', () => select(i));
  el('picker').append(button);
  return button;
});

function select(i) {
  const [name, tag, description, accent, shade, kind] = planets[i];
  Object.entries({
    name, tag, description, kind,
    order: new Intl.NumberFormat('ar').format(i + 1)
  }).forEach(([id, value]) => { el(id).textContent = value; });
  document.documentElement.style.setProperty('--accent', accent);
  document.documentElement.style.setProperty('--shade', shade);
  buttons.forEach((button, j) => button.setAttribute('aria-pressed', String(i === j)));
  globe.classList.remove('arrive');
  void globe.offsetWidth;
  globe.classList.add('arrive');
}
select(2);

const sky = el('sky');
const ctx = sky.getContext('2d');
const stars = Array.from({ length: 180 }, () =>
  [Math.random(), Math.random(), .3 + Math.random() * 1.1, .15 + Math.random() * .65]
);
function drawSky() {
  const { width, height } = sky.getBoundingClientRect();
  const scale = Math.min(devicePixelRatio || 1, 2);
  sky.width = width * scale;
  sky.height = height * scale;
  ctx.scale(scale, scale);
  for (const [x, y, r, opacity] of stars) {
    ctx.fillStyle = `rgba(220,232,255,${opacity})`;
    ctx.beginPath();
    ctx.arc(x * width, y * height, r, 0, Math.PI * 2);
    ctx.fill();
  }
}
drawSky();
addEventListener('resize', drawSky);
</script>
</body>
</html>
